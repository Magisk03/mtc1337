﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ Mag1sk1337</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#070707;
      --panel:#0f0f10;
      --panel-2:#121215;
      --border:#1e1e22;
      --accent:#f2a8c4;
      --accent-2:#e48fb0;
      --text:#f6c6d7;
      --muted:#e2a3bb;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      color:var(--text);
      font-family:"Segoe UI","PingFang SC",sans-serif;
      background:
        url("Artwork_Featured.gif") center center / 100% 100% no-repeat,
        var(--bg);
      overflow-x:hidden;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      min-height:100vh;
      position:relative;
    }
    .wrap{
      position:relative;
      z-index:1;
    }
    .stars::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        radial-gradient(2px 2px at 10% 20%, #fff8 0 50%, transparent 60%),
        radial-gradient(1px 1px at 80% 15%, #fff6 0 50%, transparent 60%),
        radial-gradient(1px 1px at 40% 70%, #fff5 0 50%, transparent 60%),
        radial-gradient(2px 2px at 70% 60%, #fff7 0 50%, transparent 60%),
        radial-gradient(1px 1px at 25% 85%, #fff5 0 50%, transparent 60%);
      opacity:.35;
      pointer-events:none;
    }
    .map::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        radial-gradient(circle at 55% 35%, rgba(255,255,255,.09) 0 3px, transparent 4px),
        radial-gradient(circle at 56% 36%, rgba(255,255,255,.08) 0 3px, transparent 4px),
        radial-gradient(circle at 57% 37%, rgba(255,255,255,.08) 0 3px, transparent 4px),
        radial-gradient(circle at 58% 38%, rgba(255,255,255,.08) 0 3px, transparent 4px),
        radial-gradient(circle at 30% 50%, rgba(255,255,255,.08) 0 3px, transparent 4px);
      background-size:26px 26px;
      opacity:.35;
      pointer-events:none;
      filter:blur(.2px);
    }
    .wrap{
      width:min(600px,calc(100vw - 32px));
      margin:0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:25px;
      perspective:900px;
    }
    .hero-stage{
      width:100vw;
      --hero-height:260px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      padding: max(24px,calc((100dvh - var(--hero-height)) / 2 - 140px)) 16px 0;
      box-sizing:border-box;
    }
    .panel{
      overflow:hidden;
      border:1px solid #aea49c20;
      border-radius:10px;
      background:#080808fa;
      box-shadow:0 0 25px #ffffff60;
      backdrop-filter:blur(40px);
      -webkit-backdrop-filter:blur(40px);
    }
    .hero{
      padding:26px 30px 22px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      position:relative;
      overflow:hidden;
      width:min(600px,calc(100vw - 32px));
      transform-style:preserve-3d;
      perspective:900px;
      transition:transform .25s ease, box-shadow .25s ease;
    }
    .hero-badge{
      position:absolute;
      top:12px;
      left:16px;
      font-size:12px;
      font-weight:600;
      letter-spacing:.6px;
      color:#0b0b0f;
      text-transform:uppercase;
      text-shadow:
        0 0 8px rgba(255,255,255,.6),
        0 0 18px rgba(255,255,255,.35);
      pointer-events:none;
    }
    .hero-visits{
      position:absolute;
      top:12px;
      right:16px;
      font-size:12px;
      font-weight:800;
      letter-spacing:.4px;
      color:#0b0b0f;
      text-transform:uppercase;
      text-shadow:
        0 0 10px rgba(255,255,255,.85),
        0 0 24px rgba(255,255,255,.6),
        0 0 40px rgba(255,255,255,.35);
      pointer-events:none;
    }
    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(600px 260px at 50% 0%, rgba(255,255,255,.06), transparent 60%);
      pointer-events:none;
    }
    .avatar-wrap{
      position:relative;
      width:96px;
      height:96px;
      border-radius:50%;
      display:grid;
      place-items:center;
      isolation:isolate;
      overflow:visible;
    }
    .avatar-wrap::before{
      content:none;
    }
    .pendant{
      position:absolute;
      inset:-18px;
      width:calc(100% + 36px);
      height:calc(100% + 36px);
      object-fit:contain;
      filter:drop-shadow(0 0 12px rgba(255,120,230,.8));
      animation:ring-float 2.6s ease-in-out infinite;
      pointer-events:none;
      z-index:3;
    }
    .avatar-wrap::after{
      content:"";
      position:absolute;
      inset:-20px;
      border-radius:22px;
      background:radial-gradient(circle, rgba(255,107,214,.18), transparent 60%);
      opacity:.9;
      z-index:-1;
      pointer-events:none;
    }
    .avatar-wrap.small{
      width:65px;
      height:65px;
    }
    .avatar-wrap.small::before{
      border-radius:16px;
      -webkit-mask:radial-gradient(circle, transparent 52%, #000 58%);
      mask:radial-gradient(circle, transparent 52%, #000 58%);
    }
    .pendant.small{
      inset:-14px;
      width:calc(100% + 28px);
      height:calc(100% + 28px);
    }
    .avatar-wrap.small::after{
      inset:-16px;
      border-radius:18px;
    }
    .avatar-frame.small{
      border-width:1px;
      box-shadow:0 0 0 3px rgba(123,60,255,.15);
    }
    .avatar-frame{
      width:100%;
      height:100%;
      border-radius:50%;
      overflow:hidden;
      border:2px solid #2a2a30;
      box-shadow:0 0 0 4px rgba(123,60,255,.15);
      position:relative;
      z-index:1;
      background:#0f0f12;
    }
    .avatar{
      width:100%;
      height:100%;
      border-radius:50%;
      object-fit:cover;
      display:block;
    }
    .name{
      font-size:20px;
      color:var(--accent);
      font-weight:700;
      letter-spacing:.3px;
    }
    .sub{
      color:#6d6d77;
      font-size:12px;
    }
    .socials{
      margin-top:6px;
      display:flex;
      gap:14px;
      align-items:center;
    }
    .social{
      margin-top:6px;
      width:20px;
      height:20px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      opacity:1;
      position:relative;
      transition:transform .2s,filter .2s;
    }
    .social:hover,.social:focus-visible{transform:scale(1.15);filter:brightness(1.3);}
    .social img,
    .social svg{
      width:20px;
      height:20px;
      display:block;
      box-sizing:border-box;
      background:transparent;
      border-radius:0;
      filter:drop-shadow(0 0 4px #fff);
    }
    .social svg{
      color:#fff;
    }
    .social svg.bilibili-icon .bilibili-body{
      fill:transparent !important;
      stroke:currentColor !important;
    }
    .social svg.bilibili-icon .bilibili-dark{
      fill:none !important;
      stroke:currentColor !important;
    }
    .social svg.bilibili-icon .bilibili-light{
      fill:none !important;
      stroke:currentColor !important;
    }
    .social img.kook-icon{filter:grayscale(1) drop-shadow(0 0 2px rgba(255,255,255,.65));}
    .social svg path{fill:currentColor !important;}
    .social img{
      object-fit:contain;
    }
    .social::after{
      content:attr(data-tooltip);
      position:absolute;
      left:50%;
      bottom:34px;
      transform:translateX(-50%);
      background:rgba(10,10,12,.85);
      color:#ffffff;
      font-size:11px;
      padding:4px 8px;
      border-radius:6px;
      letter-spacing:.5px;
      opacity:0;
      pointer-events:none;
      white-space:nowrap;
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(6px);
      transition:opacity .15s ease;
    }
    .social:hover::after{
      opacity:1;
    }
    .icon-row{
      margin-top:6px;
      display:flex;
      gap:14px;
      align-items:center;
      color:#bfbfc9;
      font-size:14px;
    }
    .icon{
      width:22px;height:22px;
      border:1px solid #2a2a30;
      border-radius:6px;
      display:grid;place-items:center;
      background:#0f0f12;
    }
    .list{
      margin-top:0;
      display:flex;
      flex-direction:column;
      gap:16px;
      width:100%;
    }
    .item{
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      transform-style:preserve-3d;
      perspective:900px;
      transition:transform .25s ease, box-shadow .25s ease;
    }
    .left{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .mini{
      width:65px;
      height:65px;
      border-radius:50%;
      object-fit:cover;
      display:block;
    }
    .avatar-wrap .mini{
      width:100%;
      height:100%;
    }
    .tag{color:var(--accent);font-weight:600;}
    .chip{
      border:1px solid #2b2b31;
      border-radius:10px;
      padding:6px 10px;
      color:#c9c9d2;
      font-size:12px;
      background:#101014;
    }
    .notice{
      color:var(--accent);
      font-weight:600;
    }
    .link{
      color:var(--accent);
      text-decoration:underline;
      font-weight:600;
    }
    .panel-link{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:158px;
      padding:10px 18px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:linear-gradient(180deg, rgba(10,10,12,.52), rgba(10,10,12,.3));
      color:#ffffff;
      text-decoration:none;
      font-weight:700;
      letter-spacing:.2px;
      text-shadow:0 0 10px rgba(255,255,255,.18);
      box-shadow:
        0 10px 24px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter:blur(16px) saturate(120%);
      -webkit-backdrop-filter:blur(16px) saturate(120%);
      transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
    }
    .panel-link:hover{
      transform:translateY(-1px);
      background:linear-gradient(180deg, rgba(18,18,22,.62), rgba(12,12,14,.38));
      box-shadow:
        0 14px 28px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.12);
      border-color:rgba(255,255,255,.24);
    }
    .muted{color:var(--muted);font-size:12px;}
    .player{
      display:flex;align-items:center;gap:12px;
      width:100%;
    }
    .btn{
      width:26px;height:26px;border-radius:50%;
      border:none;background:#0c0c0e;color:#c9a6ff;
      display:grid;place-items:center;cursor:pointer;
      font-size:11px;
    }
    .range{
      -webkit-appearance:none;appearance:none;
      height:6px;border-radius:999px;background:#1c1c22;outline:none;
    }
    .range::-webkit-slider-thumb{
      -webkit-appearance:none;appearance:none;
      width:14px;height:14px;border-radius:50%;
      background:var(--accent);border:1px solid #ffd6e6;
      box-shadow:0 0 8px rgba(242,168,196,.35);
      cursor:pointer;
    }
    .range::-moz-range-thumb{
      width:14px;height:14px;border-radius:50%;
      background:var(--accent);border:1px solid #ffd6e6;
      cursor:pointer;
    }
    .progress{flex:1;}
    .volume-wrap{
      position:relative;
      padding:8px 6px;
      cursor:pointer;
    }
    .volume{width:110px;height:12px;}
    .volume::-webkit-slider-thumb{
      width:16px;height:16px;
    }
    .volume::-moz-range-thumb{
      width:16px;height:16px;
    }
    .music{position:fixed;top:13px;right:13px;z-index:5;display:flex;align-items:center;width:52px;height:52px;overflow:hidden;border:1px solid #aea49c20;border-radius:10px;background:#161616e8;box-shadow:0 0 25px #ffffff60;backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);transition:width .3s ease,transform .2s ease;}
    .music.is-open{width:min(390px,calc(100vw - 26px));background:rgba(22,22,22,.32);border-color:rgba(255,255,255,.22);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:0 8px 28px rgba(0,0,0,.28),0 0 18px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.12);}
    .music:hover{transform:scale(1.015);}
    .music-details{display:flex;align-items:center;gap:10px;flex:1;min-width:0;height:100%;padding-left:12px;white-space:nowrap;}
    .music-details[hidden]{display:none;}
    .music-cover{width:40px;height:40px;flex:0 0 40px;border-radius:50%;object-fit:cover;}
    .music-time{color:#a8a29e;font-family:Unbounded,Arial,sans-serif;font-size:11px;font-variant-numeric:tabular-nums;}
    .music-range{-webkit-appearance:none;appearance:none;width:80px;min-width:0;height:18px;margin:0;background:transparent;cursor:pointer;}
    .music-range::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(to right,#fff 0 var(--fill,0%),#292929 var(--fill,0%) 100%);}
    .music-range::-moz-range-track{height:6px;border-radius:999px;background:#292929;}
    .music-range::-moz-range-progress{height:6px;border-radius:999px;background:#fff;box-shadow:0 0 6px #ffffffa6;}
    .music-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;margin-top:-4px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff,0 0 12px #ffffffc9;}
    .music-range::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff,0 0 12px #ffffffc9;}
    .music-volume{width:72px;}
    .music-button{display:grid;place-items:center;flex:0 0 32px;width:32px;height:40px;padding:0;border:0;color:#bbcdf0;background:none;filter:drop-shadow(0 0 4px #bbcdf0);cursor:pointer;}
    .music-button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .music-button svg[hidden]{display:none;}
    .music-toggle{flex:0 0 50px;width:50px;height:50px;}
    .music audio{display:none;}
    .reveal{
      position:fixed;
      inset:0;
      z-index:10;
      display:grid;
      place-items:center;
      width:100%;
      border:0;
      color:#ff00ae;
      background:#0008;
      backdrop-filter:blur(15px);
      -webkit-backdrop-filter:blur(15px);
      font-family:Unbounded,Arial,sans-serif;
      font-size:14px;
      cursor:pointer;
    }
    .reveal[hidden]{display:none;}
    .wrap[hidden], .music[hidden]{display:none;}
    .wrap{animation:zoom-in .35s ease-out both;transition:transform .25s ease;}
    @keyframes zoom-in{from{opacity:0;scale:.94;}to{opacity:1;scale:1;}}
    @media (prefers-reduced-motion:reduce){.wrap{animation:none;}}
    @media (max-width:600px){
      .music-details{gap:11px;padding-left:10px;}
      .music-cover{width:32px;height:32px;flex-basis:32px;}
      .music-time,.music-seek{display:none;}
      .music-volume{width:55px;}
    }
    .footer{
      margin-top:0;
      display:flex;
      justify-content:flex-end;
      color:var(--accent);
      font-size:12px;
      opacity:.8;
      width:100%;
    }
    @media (max-width:720px){
      body{background-size:cover;}
      .wrap{margin:0 auto 24px;gap:12px;}
      .hero-stage{--hero-height:210px;padding: max(24px,calc((100dvh - var(--hero-height)) / 2 - 140px)) 16px 0;}
      .hero{padding:30px 10px 16px;gap:6px;overflow:visible;}
      .hero-badge{top:6px;left:10px;font-size:8px;letter-spacing:.3px;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .hero-visits{top:6px;right:10px;font-size:8px;letter-spacing:.2px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .avatar-wrap{width:72px;height:72px;}
      .avatar-wrap.small{width:52px;height:52px;}
      .pendant.small{inset:-11px;width:calc(100% + 22px);height:calc(100% + 22px);}
      .name{font-size:16px;}
      .sub{font-size:10px;}
      .socials{gap:14px;}
      .social{width:20px;height:20px;margin-top:2px;}
      .social img,.social svg{width:20px;height:20px;}
      .social::after{display:none;}
      .list{gap:10px;}
      .item{flex-direction:column;align-items:flex-start;padding:10px 12px;gap:8px;}
      .item .left{width:100%;}
      .item .chip{align-self:flex-start;}
      .panel-link{width:100%;min-width:unset;padding:9px 12px;font-size:12px;text-align:center;}
      .player{width:100%;flex-wrap:wrap;gap:6px;}
      .btn{width:22px;height:22px;font-size:10px;}
      .progress{min-width:50px;}
      .volume{width:64px;}
      .footer{font-size:10px;justify-content:center;opacity:.6;}
    }
    @keyframes ring-float{
      0%,100%{transform:translateY(0) scale(1);}
      50%{transform:translateY(-2px) scale(1.01);}
    }
  </style>
</head>

  <div class="music" id="music" aria-label="音乐播放器" hidden>
    <div class="music-details" id="music-details" hidden>
      <img class="music-cover" src="in heat.jpg" alt="In Heat 封面" />
      <span class="music-time music-seek" id="music-elapsed">00:00</span>
      <input class="music-range music-seek" id="music-seek" type="range" min="0" max="100" value="0" aria-label="播放进度" />
      <span class="music-time music-seek" id="music-duration">00:00</span>
      <button class="music-button" id="music-play" type="button" aria-label="播放" title="播放/暂停">
        <svg data-play viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5 20 12 6 19.5Z" /></svg>
        <svg data-pause viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>
      </button>
      <input class="music-range music-volume" id="music-volume" type="range" min="0" max="100" value="30" aria-label="音量" />
    </div>
    <button class="music-button music-toggle" id="music-toggle" type="button" aria-label="展开音乐播放器" aria-expanded="false" title="音乐播放器">
      <svg data-play viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5 20 12 6 19.5Z" /></svg>
      <svg data-pause viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>
      <svg data-close viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M5 5 19 19M19 5 5 19" /></svg>
    </button>
    <audio id="music-audio" src="in heat.MP3" loop preload="metadata"></audio>
  </div>
  <script>
    const music = document.getElementById("music");
    const audio = document.getElementById("music-audio");
    const details = document.getElementById("music-details");
    const toggle = document.getElementById("music-toggle");
    const playButton = document.getElementById("music-play");
    const seek = document.getElementById("music-seek");
    const volume = document.getElementById("music-volume");
    const elapsed = document.getElementById("music-elapsed");
    const duration = document.getElementById("music-duration");

    const updateRangeFill = (range) => range.style.setProperty("--fill", `${range.value}%`);

    const formatTime = (seconds) => {
      if (!Number.isFinite(seconds)) return "00:00";
      return `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;
    };
    const updatePlayback = () => {
      const isOpen = music.classList.contains("is-open");
      playButton.setAttribute("aria-label", audio.paused ? "播放" : "暂停");
      playButton.querySelector("[data-play]").toggleAttribute("hidden", !audio.paused);
      playButton.querySelector("[data-pause]").toggleAttribute("hidden", audio.paused);
      toggle.querySelector("[data-play]").toggleAttribute("hidden", !audio.paused || isOpen);
      toggle.querySelector("[data-pause]").toggleAttribute("hidden", audio.paused || isOpen);
      toggle.querySelector("[data-close]").toggleAttribute("hidden", !isOpen);
    };

    toggle.addEventListener("click", () => {
      const isOpen = music.classList.toggle("is-open");
      details.hidden = !isOpen;
      toggle.setAttribute("aria-expanded", String(isOpen));
      toggle.setAttribute("aria-label", isOpen ? "关闭音乐播放器" : "展开音乐播放器");
      updatePlayback();
    });
    playButton.addEventListener("click", () => audio.paused ? audio.play().catch(() => {}) : audio.pause());
    seek.addEventListener("input", () => {
      if (Number.isFinite(audio.duration)) audio.currentTime = audio.duration * Number(seek.value) / 100;
      updateRangeFill(seek);
    });
    volume.addEventListener("input", () => { audio.volume = Number(volume.value) / 100; updateRangeFill(volume); });
    audio.addEventListener("loadedmetadata", () => { duration.textContent = formatTime(audio.duration); });
    audio.addEventListener("timeupdate", () => {
      elapsed.textContent = formatTime(audio.currentTime);
      seek.value = Number.isFinite(audio.duration) ? String(audio.currentTime / audio.duration * 100) : "0";
      updateRangeFill(seek);
    });
    audio.addEventListener("play", updatePlayback);
    audio.addEventListener("pause", updatePlayback);
    audio.volume = Number(volume.value) / 100;
    updateRangeFill(seek);
    updateRangeFill(volume);
    updatePlayback();

    document.getElementById("reveal").addEventListener("click", (event) => {
      event.currentTarget.hidden = true;
      document.getElementById("page").hidden = false;
      music.hidden = false;
      if (audio.paused) audio.play().catch(() => {});
    }, { once: true });

    const visitCounter = document.getElementById("visitCounter");
    const VISITS_API = "https://mtc1337-visits.magisk0311.workers.dev/api/visits?inc=1";
    if (visitCounter) {
      fetch(VISITS_API, { cache: "no-store" })
        .then((res) => res.ok ? res.json() : null)
        .then((data) => {
          if (data && typeof data.total === "number") {
            if (typeof data.today === "number") {
              visitCounter.textContent = `VISITS: ${data.total} | TODAY: ${data.today}`;
            } else {
              visitCounter.textContent = `VISITS: ${data.total}`;
            }
          } else if (data && typeof data.visits === "number") {
            visitCounter.textContent = `VISITS: ${data.visits}`;
          } else {
            visitCounter.textContent = "VISITS: ERR";
          }
        })
        .catch(() => {
          visitCounter.textContent = "VISITS: ERR";
        });
    }

    const tiltTargets = document.querySelectorAll(".wrap");
    if (tiltTargets.length) {
      let tiltEnabled = true;
      const lockTilt = () => { tiltEnabled = false; };
      const unlockTilt = () => { tiltEnabled = true; };
      document.addEventListener("pointerup", unlockTilt);
      document.addEventListener("mouseup", unlockTilt);
      document.addEventListener("pointercancel", unlockTilt);
      document.querySelectorAll("input").forEach((el) => {
        el.addEventListener("pointerdown", lockTilt);
        el.addEventListener("mousedown", lockTilt);
        el.addEventListener("pointerup", unlockTilt);
        el.addEventListener("mouseup", unlockTilt);
        el.addEventListener("pointercancel", unlockTilt);
        el.addEventListener("touchend", unlockTilt);
      });
      tiltTargets.forEach((card) => {
        card.addEventListener("mousemove", (e) => {
          if (!tiltEnabled || e.buttons === 1 || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          if (!e.target.closest(".hero, .list")) {
            card.style.transform = "";
            return;
          }
          const hero = card.querySelector(".hero");
          const list = card.querySelector(".list");
          const top = hero.offsetTop + hero.parentElement.offsetTop;
          const bottom = list.offsetTop + list.offsetHeight;
          const centerY = (top + bottom) / 2;
          const dx = Math.max(-1, Math.min(1, (e.clientX - card.offsetLeft - card.offsetWidth / 2) / (card.offsetWidth / 2)));
          const dy = Math.max(-1, Math.min(1, (e.clientY + window.scrollY - card.offsetTop - centerY) / ((bottom - top) / 2)));
          const max = 6;
          card.style.transformOrigin = `50% ${centerY}px`;
          card.style.transform = `perspective(900px) rotateX(${dy * max}deg) rotateY(${-dx * max}deg)`;
        });
        card.addEventListener("mouseleave", () => {
          card.style.transform = "";
        });
      });
    }
  </script>
